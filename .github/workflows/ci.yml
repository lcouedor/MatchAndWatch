name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          HOST: 0.0.0.0
          PORT: "3333"
          APP_KEY: ci-placeholder-key-not-used-in-build
          APP_NAME: matchAndWatch
          NODE_ENV: production
          DRIVE_DISK: local
          DB_CONNECTION: sqlite
          TMDB_API_KEY: placeholder
          TMDB_READ_ACCESS_TOKEN: placeholder
          TMDB_BASE_URL: https://api.themoviedb.org/3

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install shared-types
        working-directory: shared-types
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VUE_APP_API_URL: https://matchandwatch.onrender.com
